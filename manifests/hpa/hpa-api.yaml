apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  namespace: playground
  name: api-hpa
spec:
  minReplicas: 1
  maxReplicas: 5
  scaleTargetRef: 
    apiVersion: apps/v1
    kind: Deployment
    name: api
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70