apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: playground
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  namespace: playground
  name: postgres-svc
spec:
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Pod
metadata:
  name: postgres
  namespace: playground
  labels:
    app: db
spec:
  containers:
    - name: postgres
      image: postgres:trixie
      resources:
        requests:
          memory: "64Mi"
          cpu: "20m"
        limits:
          memory: "128Mi"
          cpu:  "150m"
      env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: secret-config
              key: POSTGRES_USER
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: config
              key: POSTGRES_DB
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-config
              key: POSTGRES_PASSWORD
      volumeMounts:
        - mountPath: /var/lib/postgresql
          name: db-volume
  volumes:
    - name: db-volume
      persistentVolumeClaim:
        claimName: postgres-pvc