apiVersion: batch/v1
kind: Job
metadata:
  namespace: playground
  name: db-init
  labels:
    app: db-init
spec:
  template:
    metadata:
      labels:
        app: db-init
    spec:
      containers:
        - name: db-init-job
          image: elbergui/playground-api:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef: 
                name: config
            - secretRef: 
                name: secret-config
          command: ["python", "db_init.py"]
      restartPolicy: Never
  backoffLimit: 4